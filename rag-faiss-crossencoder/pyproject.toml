[project]
name = "rag-faiss-crossencoder"
version = "0.1.0"
description = "RAG over a PDF with MiniLM embeddings, FAISS retrieval, cross-encoder reranking, and OpenAI generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.13.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
]
